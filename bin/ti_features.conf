# ti_features 配置文件

# =============================================================================
# LOG 配置
# =============================================================================
[LOG]
log_level = 20
log_path = ./featlog/ti_features_log

# =============================================================================
# FEATURE 基础配置
# =============================================================================
[FEATURE]
# 最大序列长度（用于 buffer 和序列特征计算）
max_seq_len = 5000

# 包大小阈值
small_pkt_threshold = 64
large_pkt_threshold = 1200

# 运行模式 (0=离线 pcap 模式，1=在线模式)
run_mode = 1

# 前 N 包统计窗口（用于 first_n_packets_length_*）
first_n_packets = 10

# =============================================================================
# BURST 配置
# =============================================================================
[BURST]
# Burst IAT 阈值（微秒）- 小于此值认为属于同一个 burst
burst_iat_threshold_us = 1000

# =============================================================================
# ACTIVE 配置（活跃/空闲时间）
# =============================================================================
[ACTIVE]
# 活跃时间 IAT 阈值（微秒）- 小于此值认为处于活跃期
active_iat_threshold_us = 1000

# =============================================================================
# WINDOW 配置（时间窗口统计）
# =============================================================================
[WINDOW]
# 窗口大小（毫秒）
window_size_ms = 1000

# 瞬时比特率窗口（毫秒）
instant_bitrate_window_ms = 100

# =============================================================================
# BEHAVIOR 配置
# =============================================================================
[BEHAVIOR]
# 交互式会话响应延迟阈值（毫秒）
interactive_threshold_ms = 100

# 大流量传输阈值（KB/s）
bulk_transfer_kbps = 10

# 短连接阈值（秒）
short_conn_threshold_s = 2

# =============================================================================
# bridge 配置
# =============================================================================
[BRIDGE]
# 两个桥 一个特征加到stream里 另一个解sni加到json里
# BRIDGE 桥接标志 (0=不桥接，1=桥接)
feature_bridge_flag = 1
# BRIDGE 桥接标识符（用于区分不同的桥接配置）
feature_bridge_name = FEATURE_BRIDGE

# SNI 桥接标志 (1=解析sni加入json，0=不桥接)
sni_bridge_flag = 1

# SNI 桥接标识符（用于区分不同的桥接配置）
sni_bridge_name = SNI_BRIDGE

# =============================================================================
# KAFKA 配置
# =============================================================================
[KAFKA]
# 是否发送 Kafka
send_kafka_flag = 0

# output_to_log 标志（1=同时输出到日志，0=仅发送 Kafka）
output_to_log = 0

# Kafka broker 地址（send_kafka_flag=1 时必填）
kafka_brokers = 10.26.22.71:9092

# Kafka topic 名称
kafka_topic = flow_features

# =============================================================================
# FEATURES 特征模块开关 (0=关闭, 1=开启)
#
# 【主开关】控制整个模块的开关。主开关=0 时，该模块的所有子开关均被忽略。
# 【子开关】控制模块内细粒度特征的开关。只有对应的主开关=1 时子开关才生效。
# 子开关关闭后，该部分特征的 per-packet 数据采集和流关闭时的输出都会被跳过。
# =============================================================================
[FEATURES]

# === 主开关（默认全部开启，关闭主开关将跳过整个模块的计算和输出）===
enable_basic = 1
enable_iat = 1
enable_protocol = 1
enable_payload = 1
enable_sequence = 0
enable_fft = 0
enable_window = 0
enable_behavior = 0

# === 基础模块子开关 ===
enable_basic_ratios = 0
enable_basic_payload_dir = 0
enable_basic_first_n = 0
enable_basic_pkt_length = 0

# === IAT 模块子开关 ===
enable_iat_stats = 0
enable_iat_fwd_bwd = 1
enable_iat_active = 0
enable_iat_response = 0

# === Burst 模块 ===
enable_burst = 1

# === 协议模块子开关 ===
enable_protocol_tcp_flags = 0
enable_protocol_tcp_window = 1
enable_protocol_ip = 1
enable_protocol_udp = 0
enable_protocol_port = 0

# === Payload 模块子开关 ===
enable_payload_size = 0
enable_payload_content = 0
enable_payload_hist = 0
enable_payload_magic = 1
# 每包阶段的载荷统计（熵/压缩率/自相关），关闭可显著降低每包处理开销
enable_payload_stats = 1

# === 序列模块子开关 ===
enable_sequence_stats = 1
# 原始序列输出（包长/IAT/方向/复合序列），关闭可减少输出大小
enable_raw_sequences = 1
# chunk 序列输出
enable_chunk_sequences = 1
# 速率序列输出
enable_rate_sequences = 1

# === FFT 模块子开关 ===
enable_fft_global = 0
enable_fft_fwd = 0
enable_fft_bwd = 1

# === Window 模块子开关 ===
enable_window_pkt = 0
enable_window_byte = 0

# === Behavior 模块子开关 ===
enable_behavior_basic = 0
enable_behavior_pattern = 0
enable_behavior_bitrate = 0

# ti_features 配置文件

# =============================================================================
# LOG 配置
# =============================================================================
[LOG]
log_level = 20
log_path = ./featlog/ti_features_log

# =============================================================================
# FEATURE 基础配置
# =============================================================================
[FEATURE]
# 最大序列长度（用于 buffer 和序列特征计算）
max_seq_len = 5000

# 包大小阈值
small_pkt_threshold = 64
large_pkt_threshold = 1200

# 运行模式 (0=离线 pcap 模式，1=在线模式)
run_mode = 0

# =============================================================================
# BURST 配置
# =============================================================================
[BURST]
# Burst IAT 阈值（微秒）- 小于此值认为属于同一个 burst
burst_iat_threshold_us = 1000

# =============================================================================
# ACTIVE 配置（活跃/空闲时间）
# =============================================================================
[ACTIVE]
# 活跃时间 IAT 阈值（微秒）- 小于此值认为处于活跃期
active_iat_threshold_us = 1000

# =============================================================================
# WINDOW 配置（时间窗口统计）
# =============================================================================
[WINDOW]
# 窗口大小（毫秒）
window_size_ms = 1000

# 瞬时比特率窗口（毫秒）
instant_bitrate_window_ms = 100

# =============================================================================
# FFT 配置
# =============================================================================
[FFT]
# FFT Top K 频率数量
fft_top_k = 5

# =============================================================================
# BEHAVIOR 配置
# =============================================================================
[BEHAVIOR]
# 交互式会话响应延迟阈值（毫秒）
interactive_threshold_ms = 100

# 大流量传输阈值（KB/s）
bulk_transfer_kbps = 10

# 短连接阈值（秒）
short_conn_threshold_s = 2

# =============================================================================
# bridge 配置
# =============================================================================
[BRIDGE] 
# 两个桥 一个特征加到stream里 另一个解sni加到json里
# BRIDGE 桥接标志 (0=不桥接，1=桥接)
feature_bridge_flag = 1
# BRIDGE 桥接标识符（用于区分不同的桥接配置）
feature_bridge_name = FEATURE_BRIDGE

# SNI 桥接标志 (1=解析sni加入json，0=不桥接)
sni_bridge_flag = 0

# SNI 桥接标识符（用于区分不同的桥接配置）
sni_bridge_name = SNI_BRIDGE

# =============================================================================
# KAFKA 配置
# =============================================================================
[KAFKA]
# 是否发送 Kafka
send_kafka_flag = 1

# output_to_log 标志（1=同时输出到日志，0=仅发送 Kafka）
output_to_log = 1

# Kafka broker 地址（send_kafka_flag=1 时必填）
kafka_brokers = 10.26.22.71:9092

# Kafka topic 名称
kafka_topic = flow_features



# =============================================================================
# OUTPUT 配置
# =============================================================================
[OUTPUT]
# 是否输出原始序列（packet_length_seq, packet_iat_seq 等）
output_raw_seq = 1
